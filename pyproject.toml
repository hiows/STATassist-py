[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statassist-py"
version = "1.0.0"
description = "Standardised statistical comparison workflows (Python port of STATassist)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Wonseok Oh", email = "hiows97@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
reduce = ["umap-learn>=0.5", "openTSNE>=1.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
all = ["statassist-py[reduce,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Recursively collects test/cursor_test/YYYY_MM_DD/*.py
testpaths = ["test/cursor_test"]
pythonpath = ["src"]
