name: Build wheels

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pure Python, so one py3-none-any wheel covers every OS and interpreter
      # and there is no cibuildwheel matrix to run.
      - name: Build
        run: pipx run build

      - name: Check the metadata PyPI will render
        run: pipx run twine check --strict dist/*

      # A tag that disagrees with the version publishes something nobody asked
      # for, and a version on PyPI cannot be replaced once it is up.
      - name: Check the tag against the version being built
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag ${TAG} does not match project version ${version}" >&2
            exit 1
          fi

      # The distribution is `statassist-py` because `statassist` was taken, so the
      # two names differ and only an install says whether the import still works.
      - name: Install the wheel and import it
        run: |
          python -m venv "${RUNNER_TEMP}/check"
          "${RUNNER_TEMP}/check/bin/python" -m pip install --quiet dist/*.whl
          "${RUNNER_TEMP}/check/bin/python" -c "import statassist as sa; print(sa.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  # On a version tag, attach the artifacts to a GitHub Release.
  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Publish to PyPI via Trusted Publisher (OIDC). Requires a pending/active
  # publisher on pypi.org for hiows/STATassist-py + wheels.yml + env "pypi".
  publish_pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
